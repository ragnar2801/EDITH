name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, test and smoke (Windows)
    runs-on: windows-latest  # Friday runs on Windows
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: extractions/setup-just@v2
      - run: just setup
      - run: just lint
      - run: just test
      - run: just api-check
      - run: just smoke
